# INFRA-04: config กลางของ lint / test และรายการ dependency
# repo นี้ไม่ใช่ package ที่ติดตั้ง จึงใช้ [dependency-groups] (PEP 735) แทน [project]
#   pip install --group dev        (pip >= 25.1)
#   uv pip install --group dev

[dependency-groups]
ingestion = ["PyYAML>=6.0", "confluent-kafka>=2.5"]
test = ["pytest>=8", "PyYAML>=6.0"]
lint = ["ruff==0.16.10"]
# F3: FinBERT ในเครื่อง (ใน Spark ใช้ image infra/spark/Dockerfile.ml)
sentiment = ["torch>=2.4", "transformers>=4.44"]
# F5: เว็บแอป (ADR-0008)
web = ["fastapi>=0.110", "uvicorn>=0.29", "PyYAML>=6.0", "httpx>=0.27"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "web" },
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# ค่าเริ่มต้น (E4, E7, E9, F) + import เรียงลำดับ + bug ที่พบบ่อย
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
