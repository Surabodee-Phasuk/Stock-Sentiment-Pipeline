# ค่าเริ่มต้นของ Spark ใน container `spark` (INFRA-03)
# เวอร์ชันต้องตรงกับ image: Spark 4.0.x / Scala 2.13

spark.jars.packages                       org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.12.0,org.apache.iceberg:iceberg-aws-bundle:1.12.0,org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.4
spark.jars.ivy                            /opt/ivy

# Iceberg บน S3 ผ่าน Glue catalog ชื่อ `glue` (ADR-0001, ADR-0003)
spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.glue                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.glue.catalog-impl       org.apache.iceberg.aws.glue.GlueCatalog
spark.sql.catalog.glue.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.glue.warehouse          s3://stock-sentiment-lakehouse-surabodee/warehouse
spark.sql.defaultCatalog                  glue

spark.sql.session.timeZone                UTC
