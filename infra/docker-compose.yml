# Kafka + Spark สำหรับพัฒนาในเครื่อง (INFRA-03) — วิธีใช้ดู infra/README.md
#   docker compose -f infra/docker-compose.yml up -d
name: stock-sentiment

services:
  # Kafka แบบ KRaft โหนดเดียว (ไม่ต้องมี ZooKeeper)
  # - จากเครื่อง (collector): localhost:9092
  # - จาก container อื่น (Spark): kafka:19092
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # สร้าง topic ผ่าน kafka-init เท่านั้น กันพิมพ์ชื่อ topic ผิดแล้วได้ topic ใหม่โดยไม่รู้ตัว
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # สร้าง topic แล้วจบ (key = ticker ตาม docs/05)
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic ${KAFKA_TOPIC:-stock-news}
        --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --describe --topic ${KAFKA_TOPIC:-stock-news}
    restart: "no"

  # Spark แบบ local mode ไว้รัน spark-submit / pyspark ผ่าน `docker compose exec spark ...`
  # เขียน Iceberg บน S3 ผ่าน Glue catalog ด้วย credential จาก ~/.aws (mount แบบอ่านอย่างเดียว)
  spark:
    image: apache/spark:4.0.4-scala2.13-java17-python3-ubuntu
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    # root เพราะ ~/.aws/credentials เป็น 600 และ volume ivy-cache ถูกสร้างเป็น root; ใช้แค่ในเครื่อง dev
    user: root
    command: ["tail", "-f", "/dev/null"]
    working_dir: /workspace
    ports:
      - "4040:4040"
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_CONFIG_FILE: /opt/aws/config
      AWS_SHARED_CREDENTIALS_FILE: /opt/aws/credentials
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-stock-news}
    volumes:
      - ..:/workspace
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ${AWS_DIR:-${HOME}/.aws}:/opt/aws:ro
      - ivy-cache:/opt/ivy

volumes:
  # cache jar ของ Iceberg / Kafka connector ไม่ต้องโหลดใหม่ทุกครั้งที่สร้าง container
  ivy-cache:
